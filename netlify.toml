[build]
  command = "npm run build"
  publish = "dist"

# An explicit language choice is handled by the Edge Function first. These
# redirects provide the browser-language fallback when no preference exists.
[[redirects]]
  from = "/"
  to = "/tr"
  status = 302
  force = true
  conditions = { Language = ["tr"] }

[[redirects]]
  from = "/"
  to = "/es"
  status = 302
  force = true
  conditions = { Language = ["es"] }

[[redirects]]
  from = "/"
  to = "/en"
  status = 302
  force = true
